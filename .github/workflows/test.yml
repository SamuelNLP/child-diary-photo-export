name: Tests

on:
  push:
    branches: [add-gui, master]
  pull_request:
    branches: [add-gui, master]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run tests
        run: |
          # Run tests without GUI tests on headless systems
          # (Tkinter GUI tests require a display)
          uv run pytest tests/test_cli.py -v --tb=short

      - name: Run GUI tests (Linux only with Xvfb)
        if: runner.os == 'Linux'
        run: |
          # Install Xvfb for headless GUI testing
          sudo apt-get update
          sudo apt-get install -y xvfb
          # Run GUI tests with virtual display
          Xvfb :99 -screen 0 1024x768x16 &
          export DISPLAY=:99
          uv run pytest tests/test_gui.py -v --tb=short
        continue-on-error: true

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            .coverage
            coverage.xml
          if-no-files-found: ignore
